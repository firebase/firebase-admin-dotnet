name: Continuous Integration

on: pull_request

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }}, ${{ matrix.framework-version }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            framework-version: net462
          - os: ubuntu-latest
            framework-version: net6.0
          - os: ubuntu-latest
            framework-version: net10.0

    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      TARGET_FRAMEWORK: ${{ matrix.framework-version }}

    defaults:
      run:
        shell: bash

    runs-on: ${{ matrix.os }}

    steps:
    - name: Configure Git for Windows
      if: runner.os == 'Windows'
      run: |
        git config --global core.autocrlf false
        git config --global core.longpaths true

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: |
          6.0.x
          10.0.x

    - name: Install dependencies
      run: dotnet restore FirebaseAdmin/FirebaseAdmin.sln

    - name: Build with dotnet
      run: dotnet build FirebaseAdmin/FirebaseAdmin.sln --configuration Release --no-restore

    - name: Run unit tests
      run: |
        dotnet test FirebaseAdmin/FirebaseAdmin.Tests --configuration Release --no-restore --no-build --framework "${TARGET_FRAMEWORK}"
